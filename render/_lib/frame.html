<html><head><meta charset="utf-8">
<style>
@font-face{font-family:KR;src:url('file:///C:/Windows/Fonts/NotoSansKR-Bold.ttf');font-weight:700}
@font-face{font-family:KR;src:url('file:///C:/Windows/Fonts/NotoSansKR-Regular.ttf');font-weight:400}

<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="common.js"></script>
<script>
// ?unit=../01_hook  → 그 폴더의 scene.js 를 불러온다
const unit = new URLSearchParams(location.search).get('unit');
window.ready = false;
const s = document.createElement('script');
s.src = unit + '/scene.js';
s.onload = () => Promise.all([document.fonts.load('700 40px KR'), document.fonts.load('400 40px KR'), document.fonts.load('900 40px KRH')])
  .then(() => loadAssets(COMMON_ASSETS.concat(typeof ASSETS === 'undefined' ? [] : ASSETS)))
  .then(() => { draw(0); window.ready = true; })
  .catch(e => { window.loadError = String(e); });
document.body.appendChild(s);
</script></body></html>
